<!doctype html>
<!-- Starting html -->
<html lang="en">
  <!--Starting head-->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Gallery</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <!--Ending head-->

  <!--Starting body-->
  <body>
    <!-- HEADER -->
    <header>
      <div class="logo">
        <div class="logo-main">Lu<em>mina</em></div>
        <div class="logo-sub">Visual archive &amp; gallery</div>
      </div>
      <div class="header-meta">
        <span id="img-count">12</span>
        images in collection
      </div>
    </header>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <div class="filter-pills">
        <button class="pill active" data-cat="all">All</button>
        <button class="pill" data-cat="nature">Nature</button>
        <button class="pill" data-cat="architecture">Architecture</button>
        <button class="pill" data-cat="portrait">Portrait</button>
        <button class="pill" data-cat="abstract">Abstract</button>
      </div>
      <div class="divider"></div>
      <div class="view-toggles">
        <!-- 3-col grid -->
        <button class="view-btn active" data-view="grid-3" title="3 columns">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect
              x="1"
              y="1"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="6"
              y="1"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="11"
              y="1"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="1"
              y="6"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="6"
              y="6"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="11"
              y="6"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="1"
              y="11"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="6"
              y="11"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="11"
              y="11"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
          </svg>
        </button>
        <!-- 4-col grid -->
        <button class="view-btn" data-view="grid-4" title="4 columns">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect
              x="1"
              y="1"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="5"
              y="1"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="9"
              y="1"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="13"
              y="1"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="1"
              y="5"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="5"
              y="5"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="9"
              y="5"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="13"
              y="5"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="1"
              y="9"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="5"
              y="9"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="9"
              y="9"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="13"
              y="9"
              width="3"
              height="3"
              rx="0.5"
              fill="currentColor"
            />
          </svg>
        </button>
        <!-- masonry -->
        <button class="view-btn" data-view="grid-masonry" title="Masonry">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect
              x="1"
              y="1"
              width="4"
              height="7"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="6"
              y="1"
              width="4"
              height="4"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="11"
              y="1"
              width="4"
              height="10"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="6"
              y="6"
              width="4"
              height="5"
              rx="0.5"
              fill="currentColor"
            />
            <rect
              x="1"
              y="9"
              width="4"
              height="6"
              rx="0.5"
              fill="currentColor"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- GALLERY -->
    <main>
      <div class="gallery grid-3" id="gallery"></div>
    </main>

    <!-- LIGHTBOX -->
    <div
      class="lightbox"
      id="lightbox"
      role="dialog"
      aria-modal="true"
      aria-label="Image lightbox"
    >
      <div class="lb-backdrop" id="lbBackdrop"></div>
      <button class="lb-close" id="lbClose" aria-label="Close lightbox">
        &#x2715;
      </button>
      <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous image">
        &#8592;
      </button>
      <button class="lb-nav lb-next" id="lbNext" aria-label="Next image">
        &#8594;
      </button>

      <div class="lb-content">
        <div class="lb-img-wrap">
          <img id="lbImg" src="" alt="" />
        </div>
        <div class="lb-info">
          <div class="lb-category" id="lbCat"></div>
          <div class="lb-title" id="lbTitle"></div>
          <div class="lb-desc" id="lbDesc"></div>
          <div class="lb-counter">
            <span id="lbCurrent">1</span> / <span id="lbTotal">12</span>
          </div>
        </div>
      </div>

      <div class="lb-thumbs" id="lbThumbs"></div>
    </div>

    <script src="script.js"></script>
    <!-- Ending body -->
  </body>
  <!-- Ending html -->
</html>
